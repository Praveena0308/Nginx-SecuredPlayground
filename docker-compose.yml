version: '3'

services:
  # Your original app - UNCHANGED!
  security-playground:
    image: sysdiglabs/security-playground
    expose:
      - "8080"  # Only exposed internally, not to internet
    # No ports exposed to host!
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 5
  
  # Nginx proxy with authentication
  nginx-proxy:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "8080:80"  # Public port
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./.htpasswd:/etc/nginx/.htpasswd:ro
      - ./cert.pem:/etc/nginx/ssl/cert.pem:ro
      - ./key.pem:/etc/nginx/ssl/key.pem:ro
    depends_on:
      - security-playground